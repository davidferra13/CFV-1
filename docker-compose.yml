# Local PostgreSQL for ChefFlow development
# Usage: docker compose up -d
# Connection: postgresql://postgres:CHEF.jdgyuegf9924092.FLOW@127.0.0.1:54322/postgres

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg15
    container_name: chefflow_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:54322:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CHEF.jdgyuegf9924092.FLOW
      POSTGRES_DB: postgres
    volumes:
      - chefflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chefflow_pgdata:
